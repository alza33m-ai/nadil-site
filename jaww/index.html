<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جوّ من نادل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: control panel (form) beside a live 16:9 preview of the café TV; a second view shows the TV screen alone. */
:root{
  --bg:#F5F5F7; --panel:#FFFFFF; --panel2:#F2F2F7; --line:#E5E5EA; --fg:#1D1D1F; --muted:#6E6E73;
  --ember:#8E1B2C; --gold:#D99A26; --mint:#1E8556; --danger:#B23A33;
  --display:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif; --body:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.brand small{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--ember);color:#fff}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="live"] i{background:var(--mint);animation:pulse 1.6s infinite}
.sync[data-s="live"]{color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px;font-weight:600}
.btn:hover{border-color:#C7C7CC}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#fff}
.btn.primary:hover{background:#6E1422;border-color:#6E1422}
a.btn{text-decoration:none;color:inherit}
.btn.ghost{background:none}
.btn.small{min-height:34px;padding:4px 10px;font-size:13px}
.btn.icon{width:36px;min-height:36px;padding:0;justify-content:center}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}

/* admin layout */
.admin{flex:1;display:flex;flex-wrap:wrap;gap:20px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:flex-start}
.previewCol{flex:999 1 560px;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:12px}
.formCol{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:12px}
@media (max-width:980px){.previewCol{position:static}}
.stageWrap{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#000}
.stage{position:absolute;top:0;right:0;width:1920px;height:1080px;transform-origin:top right}
.previewBar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hint{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:7px 12px;border-radius:6px;font-size:13px;color:var(--muted);font-weight:600}
.seg input:checked + span{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px #D1D1D6;background:#fff}
.seg input:focus-visible + span{outline:2px solid var(--gold)}

/* form */
details.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
details.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .count{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);background:var(--panel2);border-radius:999px;padding:2px 8px}
details.card>summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s}
details.card[open]>summary::after{transform:rotate(135deg)}
.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:600}
.in{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px}
.in:focus{border-color:var(--ember)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{position:relative;width:36px;height:36px}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.sw span{display:block;width:100%;height:100%;border-radius:50%;border:2px solid transparent}
.sw input:checked + span{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.sw input:focus-visible + span{outline:2px solid var(--gold);outline-offset:2px}
.color{width:44px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.sec{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.secHead{display:flex;gap:8px;align-items:center}
.secHead .in{font-weight:700}
.item{display:grid;grid-template-columns:minmax(0,1fr) 76px 36px;gap:6px;align-items:center}
.match{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;background:var(--bg)}
.match.big{border-color:rgba(245,196,81,.55);background:rgba(245,196,81,.05)}
.match .wide{grid-column:1 / 3}
.match .flags{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-height:36px}
.check input{width:18px;height:18px;accent-color:var(--gold)}
.vs{font-size:12px;color:var(--muted);text-align:center}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}
.addRow{display:flex;flex-wrap:wrap;gap:8px}

/* screen view */
.screenView{flex:1;display:flex;align-items:center;justify-content:center;background:#000;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screenView .stageWrap{border:0;border-radius:0;max-width:calc((100vh - 120px) * 16 / 9)}
.stageWrap:fullscreen{max-width:none;width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;border:0}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;z-index:20}

/* ============ TV screen (fixed 1920×1080) ============ */
.sc{--acc:#8E1B2C;--mbg:#F5F1EC;--ink:#1D1D1F;--mut:#6E6E73;--rule:rgba(29,29,31,.14);--pbg:#1D1D1F;--pfg:#F5F5F7;--pmut:#A1A1A6;
  position:relative;width:1920px;height:1080px;overflow:hidden;direction:rtl;font-family:var(--body);color:var(--ink);background:var(--mbg);display:grid;grid-template-columns:1200px 720px;grid-template-rows:1016px 64px}
.sc.night{--mbg:#161618;--ink:#F5F5F7;--mut:#A1A1A6;--rule:rgba(245,245,247,.12);--pbg:#000000}
.sc .menu{display:flex;flex-direction:column;min-width:0}
.sc .mhead{padding:44px 56px 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:3px solid var(--acc)}
.sc .cafe{font-family:var(--display);font-weight:700;font-size:92px;line-height:1.05;color:var(--acc);text-wrap:balance}
.sc .mid{display:flex;align-items:center;gap:28px}
.sc .clogo{width:132px;height:132px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 10px 30px -12px rgba(0,0,0,.4);flex:none}
.sc .nmain .clogo{width:110px;height:110px}
.sc .tagl{font-size:22px;letter-spacing:.2em;color:var(--mut);font-weight:600;margin-top:6px}
.sc .unit{font-size:18px;color:var(--mut);text-align:left;line-height:1.6}
.sc .mbody{flex:1;padding:28px 56px 20px;column-count:3;column-gap:48px;column-fill:auto;overflow:hidden}
.sc .msec{break-inside:avoid;margin-bottom:26px}
.sc .msec h3{margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:34px;line-height:1.3;display:flex;align-items:center;gap:12px}
.sc .msec h3::after{content:"";flex:1;height:3px;background:var(--acc);border-radius:2px;opacity:.85}
.sc .mi{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:24px}
.sc .mi .n{font-weight:500}
.sc .mi .d{flex:1;border-bottom:2px dotted var(--rule);transform:translateY(-6px)}
.sc .mi .p{font-weight:700;font-variant-numeric:tabular-nums;font-size:26px}
.sc .mempty{column-span:all;color:var(--mut);font-size:28px;padding-top:40px}
.sc .side{background:var(--pbg);color:var(--pfg);padding:32px 36px 24px;display:flex;flex-direction:column;gap:20px;min-width:0}
.sc .side h2{margin:0;font-family:var(--display);font-weight:700;font-size:50px;line-height:1.1}
.sc .kick{font-size:16px;letter-spacing:.18em;color:var(--pmut)}
.sc .chip{display:inline-block;font-size:14px;font-weight:700;padding:4px 10px;border-radius:4px;color:#fff;white-space:nowrap}
.sc .cw{display:inline-flex;align-items:center;gap:6px}
.sc .lg{flex:none;width:30px;height:30px;border-radius:50%;background:#F5ECE1;display:inline-flex;align-items:center;justify-content:center}
.sc .lg img{width:23px;height:23px;object-fit:contain;display:block}
.sc .nmeta .lg{width:52px;height:52px}.sc .nmeta .lg img{width:40px;height:40px}
.sc .track span{display:inline-flex;align-items:center;gap:12px}
.sc .tl{flex:none;width:46px;height:46px;border-radius:50%;background:#F5ECE1;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.sc .tl img{max-width:32px;max-height:32px;width:auto;height:auto;object-fit:contain;display:block}
.sc .ticket{border:2px solid var(--acc);border-radius:10px;padding:20px 24px;display:flex;flex-direction:column;gap:14px;background:rgba(255,255,255,.03)}
.sc .ticket .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;color:var(--pmut)}
.sc .ticket .teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:36px;line-height:1.2}
.sc .ticket .teams span:last-child{text-align:left}
.sc .ticket .x{color:var(--acc);font-size:44px}
.sc .cds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sc .cd{display:flex;flex-direction:column;align-items:center;border:1px solid rgba(244,239,232,.2);border-radius:8px;padding:6px 0}
.sc .cd b{font-size:42px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.sc .cd small{font-size:14px;color:var(--pmut)}
.sc .liveTag{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:34px;color:var(--gold)}
.sc .liveTag i,.sc .lv i{width:14px;height:14px;border-radius:50%;background:var(--gold);animation:pulse 1.4s infinite}
.sc .list{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow:hidden}
.sc .lh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid rgba(244,239,232,.6);padding-bottom:8px;margin-bottom:4px}
.sc .lh b{font-family:var(--display);font-weight:700;font-size:30px}
.sc .lh small{font-size:14px;color:var(--pmut)}
.sc .mr{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:14px;padding:9px 12px;border-radius:6px;border:1px solid transparent;border-bottom-color:rgba(244,239,232,.1)}
.sc .mr.big{border-color:rgba(245,196,81,.6);background:rgba(245,196,81,.09)}
.sc .mr .when{display:flex;flex-direction:column;line-height:1.2}
.sc .mr .when small{font-size:14px;color:var(--pmut)}
.sc .mr .when b{font-size:20px;font-variant-numeric:tabular-nums}
.sc .mr .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.sc .mr .t b{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .mr.big .t b{color:#F2C46A;font-weight:700}
.sc .mr .c{display:flex;gap:8px;align-items:center}
.sc .star{font-size:13px;font-weight:700;color:var(--gold)}
.sc .lv{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#1D1D1F;background:#F2C46A;padding:4px 10px;border-radius:4px}
.sc .lv i{width:8px;height:8px;background:#1D1D1F}
.sc .offer{border:1.5px dashed var(--acc);border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.sc .offer small{font-size:15px;color:var(--pmut);display:block}
.sc .offer b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.3}
.sc .offer .pr{font-size:30px;font-weight:700;color:var(--acc);white-space:nowrap}
/* asian cup panel */
.sc .ac{position:relative;overflow:hidden;flex:none;margin-top:auto;border:1.5px solid var(--mint);border-radius:8px;color:#EAF4EC;background-color:#0F2E20;background-image:linear-gradient(45deg,rgba(125,226,166,.07) 25%,transparent 25%,transparent 75%,rgba(125,226,166,.07) 75%),linear-gradient(45deg,rgba(125,226,166,.07) 25%,transparent 25%,transparent 75%,rgba(125,226,166,.07) 75%);background-size:22px 22px;background-position:0 0,11px 11px}
.sc .ac::after{content:"";position:absolute;top:0;bottom:0;width:140px;left:-180px;background:linear-gradient(100deg,transparent,rgba(234,244,236,.16),transparent);animation:sweep 5s ease-in-out infinite;pointer-events:none}
.sc .sadu{height:6px;background-image:linear-gradient(135deg,var(--mint) 25%,transparent 25%),linear-gradient(225deg,var(--mint) 25%,transparent 25%);background-size:12px 12px}
.sc .acin{position:relative;z-index:1;display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:20px;padding:16px 20px}
.sc .acyr{width:92px;height:124px;border-radius:10px;background:#F5ECE1;display:flex;align-items:center;justify-content:center;padding:8px;animation:glow 3s ease-in-out infinite}
.sc .acyr img{max-height:100%;max-width:100%;width:auto;height:auto;display:block}
.sc .acm{min-width:0;display:flex;flex-direction:column;gap:4px}
.sc .acm .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sc .acm .k{font-size:14px;letter-spacing:0;color:var(--mint);font-weight:600;white-space:nowrap}
.sc .acm .h{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.25;white-space:nowrap}
.sc .acm .s{font-size:14px;color:#B9D6C2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .flips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.sc .flip{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;border-radius:4px;background:rgba(0,0,0,.35);border:1px solid rgba(125,226,166,.35)}
.sc .flip::before{content:"";position:absolute;left:0;right:0;top:44%;height:1px;background:rgba(15,46,32,.9)}
.sc .flip b{font-size:30px;font-weight:700;line-height:1.1;color:var(--mint);font-variant-numeric:tabular-nums}
.sc .flip small{font-size:12px;color:#B9D6C2}
/* asian cup panel: alternative styles */
.sc .ac.acT,.sc .ac.acG,.sc .ac.acB{background-image:none;border:0}
.sc .ac.acT::after,.sc .ac.acG::after{display:none}
.sc .acT{display:grid;grid-template-columns:118px minmax(0,1fr);background:#F5ECE1!important;color:#0F2E20;border-radius:14px}
.sc .acT .stub{position:relative;display:flex;align-items:center;justify-content:center;padding:14px;background:#0F2E20;border-left:3px dashed #F5ECE1}
.sc .acT .stub img{height:130px;width:auto;max-width:100%;object-fit:contain;background:#F5ECE1;border-radius:8px;padding:6px}
.sc .acT .stub::before,.sc .acT .stub::after{content:"";position:absolute;left:-14px;width:26px;height:26px;border-radius:50%;background:var(--pbg)}
.sc .acT .stub::before{top:-13px}.sc .acT .stub::after{bottom:-13px}
.sc .acT .tmain{padding:16px 22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sc .acT .ttop{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:#1E8556}
.sc .acT .gate{background:#0F2E20;color:#F5ECE1;border-radius:4px;padding:2px 10px;font-size:13px}
.sc .acT .h{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.25}
.sc .acT .tcd{display:flex;gap:18px;align-items:flex-end;border-top:1.5px solid rgba(15,46,32,.2);border-bottom:1.5px solid rgba(15,46,32,.2);padding:6px 0}
.sc .acT .tcd div{display:flex;align-items:baseline;gap:5px}
.sc .acT .tcd b{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.sc .acT .tcd small{font-size:14px;color:#4B6B58}
.sc .acT .s{font-size:14px;color:#4B6B58}
.sc .acG{background:#141210!important;color:#F4EFE8;border-radius:12px;border-top:3px solid #D9A441!important;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.sc .acG .gtop{display:flex;align-items:center;gap:16px}
.sc .acG .lg{flex:none;width:62px;height:82px;border-radius:10px;background:#F5ECE1;box-shadow:0 0 0 2px #D9A441;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:5px}
.sc .acG .lg img{height:100%;width:auto;max-width:100%;object-fit:contain}
.sc .acG .k{font-size:14px;color:#D9A441;font-weight:600}
.sc .acG .h{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.25}
.sc .acG .gcd{display:flex;align-items:flex-start;justify-content:space-between}
.sc .acG .gcd div{display:flex;flex-direction:column;align-items:center;min-width:70px}
.sc .acG .gcd b{font-size:46px;font-weight:700;line-height:1.05;color:#F2C46A;font-variant-numeric:tabular-nums}
.sc .acG .gcd small{font-size:13px;color:#A1A1A6}
.sc .acG .gcd i{font-style:normal;font-size:38px;color:#5A5148;line-height:1.1}
.sc .acB{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;padding:18px 22px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#0F5A39,#0F2E20)!important}
.sc .acB .bnum{display:flex;align-items:center;gap:10px}
.sc .acB .bnum b{font-size:92px;font-weight:700;line-height:1;color:#7DE2A6;font-variant-numeric:tabular-nums}
.sc .acB .bnum span{font-size:16px;line-height:1.4;color:#CFEBD9;font-weight:600}
.sc .acB .bside{min-width:0;display:flex;flex-direction:column;gap:4px;border-right:1.5px solid rgba(125,226,166,.35);padding-right:18px}
.sc .acB .h{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.25;white-space:nowrap}
.sc .acB .s{font-size:14px;color:#B9D6C2}
.sc .acB .bhms{display:flex;gap:4px;align-items:baseline;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:#EAF4EC;direction:ltr;justify-content:flex-end}
.sc .acB .bhms i{font-style:normal;opacity:.5}

        fetch(url, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
          if (d && d.config && (d.at || 0) > lastAt) { lastAt = d.at; applyRemote(d); }
        }).catch(function () { setSync('local', 'انقطع الاتصال، بنحاول…'); });
      }, 4000);
    }).catch(function () {});
  }
  function startSync() {
    if (!window.claude || !window.claude.use) { startServer(); return; }
    window.claude.use('db').then(function (d) {
      if (!d) { startServer(); return; }
      db = d; ref = db.doc('venues/main');
      setSync('wait', 'يتصل…');
      ref.onSnapshot(function (snap) {
        setSync('live', 'متزامن مع الشاشة');
        if (!snap.exists) return;
        applyRemote(snap.data());
      }, function () { setSync('local', 'تجربة على هذا الجهاز'); ref = null; });
    }).catch(function () { startServer(); });
  }

  window.addEventListener('resize', refit);
  if (window.ResizeObserver) { new ResizeObserver(refit).observe($('previewWrap')); new ResizeObserver(refit).observe($('screenWrap')); }
  ensure(state);
  if (view !== 'pair') renderForm();
  setView(view);
  startSync();
})();
</script>
