<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>جوّ للفعاليات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--m:#8E1B2C;--bg:#F5F5F7;--card:#fff;--ink:#1D1D1F;--mut:#6E6E73;--line:#E3E3E8;--ok:#1E8556;--warn:#9A6A00;--bad:#B23A33;--font:'IBM Plex Sans Arabic',Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--m);outline-offset:2px}
[hidden]{display:none!important}
/* top */
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .in{max-width:1500px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-size:22px;line-height:1}
.brand small{color:var(--mut);font-size:12px}
.seg{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button,.seg label{border:0;background:none;border-radius:9px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--mut);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.seg [aria-pressed="true"],.seg [aria-selected="true"],.seg input:checked+span{background:var(--m);color:#fff}
.seg label{padding:0}.seg label span{padding:6px 12px;border-radius:9px}.seg label input{position:absolute;opacity:0;pointer-events:none}
.sync{margin-inline-start:auto;font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px}
.sync i{width:8px;height:8px;border-radius:50%;background:#C7C7CC}
.sync[data-s="live"] i{background:var(--ok)}
/* layout */
.lay{max-width:1500px;margin:0 auto;padding:16px 18px 60px;display:grid;grid-template-columns:420px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:1000px){.lay{grid-template-columns:1fr}.pv{order:-1}}
.form{display:flex;flex-direction:column;gap:12px}
details.card{background:var(--card);border-radius:16px;box-shadow:0 1px 0 var(--line);border:1px solid var(--line)}
details.card>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"⌄";margin-inline-start:auto;color:var(--mut)}
details[open].card>summary::after{content:"⌃"}
.count{font-size:12px;font-weight:700;background:#F2F2F7;color:var(--mut);border-radius:10px;padding:1px 8px}
.count.hot{background:#FDECEE;color:var(--m)}
.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.lbl{font-size:13.5px;font-weight:600}
.in{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:15px;background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:86px minmax(0,1fr) 34px;gap:6px;align-items:center}
.rowS{display:grid;grid-template-columns:minmax(0,1fr) 92px 34px;gap:6px;align-items:center}
.btn{border:0;border-radius:11px;padding:8px 14px;font-weight:700;font-size:14px;background:var(--m);color:#fff;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.gh{background:#F2F2F7;color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.x{border:0;background:#F2F2F7;width:34px;height:34px;border-radius:10px;font-size:16px}
.hint{font-size:12.5px;color:var(--mut);margin:0;line-height:1.7}
.check{display:flex;gap:8px;align-items:center;font-size:14.5px}
.check input{width:18px;height:18px;accent-color:var(--m)}
.tpl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tpl button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
.tpl button i{font-style:normal;font-size:22px}
.tpl button[aria-pressed="true"]{border-color:var(--m);box-shadow:0 0 0 2px var(--m) inset;color:var(--m)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw label{width:30px;height:30px;border-radius:50%;cursor:pointer;position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.1) inset}
.sw input{position:absolute;opacity:0}
.sw input:checked+span{position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink)}
.res{display:flex;flex-direction:column;gap:6px}
.res div{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13.5px}
.res .b{grid-column:1 / -1;height:6px;border-radius:3px;background:#F2F2F7;overflow:hidden}.res .b i{display:block;height:100%;background:var(--m)}
.msg{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.msg b{font-size:13px}.msg .a{display:flex;gap:6px}
.msg.wait{border-color:#F0D9A0;background:#FFFBEF}
.rep{width:100%;border-collapse:collapse;font-size:13.5px}
.rep th,.rep td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.rep th{color:var(--mut);font-weight:600;font-size:12.5px}
.links{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.links .q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
.links .q svg{display:block;width:100%;height:auto}
.mono{direction:ltr;font-family:ui-monospace,monospace;font-size:12px;background:#F2F2F7;border-radius:8px;padding:6px 8px;word-break:break-all;text-align:left}
/* preview */
.pv{position:sticky;top:76px;display:flex;flex-direction:column;gap:10px}
.stageWrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#000;box-shadow:0 24px 60px -30px rgba(0,0,0,.6)}
.stage{position:absolute;top:0;right:0;width:1920px;height:1080px;transform-origin:top right}
.pvbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1D1D1F;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:50}
/* screen view */
body.screen .top,body.screen .lay{display:none}
body.screen{background:#000;overflow:hidden}
.full{position:fixed;inset:0;display:none}
body.screen .full{display:block}

/* ================== الشاشة 1920x1080 ================== */
.sc{--a:#8E1B2C;--a2:#F2C46A;position:relative;width:1920px;height:1080px;overflow:hidden;background:#0E0E11;color:#F5F5F7;font-family:var(--font)}
.sc::before{content:"";position:absolute;inset:0;background:radial-gradient(1200px 700px at 85% -10%,color-mix(in srgb,var(--a) 55%,transparent),transparent 70%),radial-gradient(900px 600px at 0% 110%,color-mix(in srgb,var(--a2) 18%,transparent),transparent 70%);pointer-events:none}
.sc .hd{position:absolute;top:44px;right:72px;left:72px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.sc .hd .n{font-size:30px;font-weight:700}
.sc .hd .tag{font-size:26px;font-weight:600;color:var(--a2);direction:ltr}
.sc .main{position:absolute;top:130px;right:72px;left:72px;bottom:150px;z-index:1}
.sc .qr{background:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#1D1D1F}
.sc .qr svg{width:100%;height:auto;display:block}
.sc .qr b{font-size:24px;line-height:1.3;text-align:center}
.sc .qr small{font-size:17px;color:#6E6E73;text-align:center}
.sc .rib{position:absolute;bottom:0;right:0;left:0;height:96px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:28px;padding:0 72px;z-index:2;font-size:26px}
.sc .rib .sp{display:flex;align-items:center;gap:16px;margin-inline-start:auto}
.sc .rib .sp small{color:#A1A1A6;font-size:20px}
.sc .rib .sp b{font-size:28px}
.sc .rib .lg{height:60px;max-width:220px;object-fit:contain;background:#fff;border-radius:10px;padding:6px 10px}
.sc .rib .now{display:flex;align-items:center;gap:12px}
.sc .rib .now i{width:12px;height:12px;border-radius:50%;background:#FF453A;animation:pulse 1.4s infinite}
.sc .rib .now small{color:#A1A1A6;font-size:20px}
/* welcome */
.sc .wel{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:80px;align-items:center}
.sc .wel .k{font-size:34px;color:var(--a2);font-weight:600}
.sc .wel h1{font-size:132px;line-height:1.15;margin:10px 0 18px;font-weight:700;text-wrap:balance}
.sc .wel .d{font-size:36px;color:#D1D1D6}
.sc .wel .nx{margin-top:44px;display:flex;gap:18px}
.sc .wel .nx div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px 26px;min-width:320px}
.sc .wel .nx small{display:block;font-size:20px;color:#A1A1A6}
.sc .wel .nx b{font-size:32px}
/* poll */
.sc .pol{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:70px;align-items:center}
.sc .pol .k{font-size:28px;color:var(--a2);font-weight:700;display:flex;align-items:center;gap:12px}
.sc .pol .k i{width:14px;height:14px;border-radius:50%;background:#FF453A;animation:pulse 1.4s infinite}
.sc .pol h2{font-size:68px;line-height:1.3;margin:12px 0 36px;font-weight:700;text-wrap:balance}
.sc .pol .op{position:relative;height:92px;border-radius:20px;background:rgba(255,255,255,.07);margin-bottom:18px;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:36px;font-weight:600}
.sc .pol .op .f{position:absolute;inset:0 0 0 auto;background:linear-gradient(270deg,var(--a),color-mix(in srgb,var(--a) 60%,#fff));transition:width 1s cubic-bezier(.2,.8,.2,1);z-index:0}
.sc .pol .op.win .f{background:linear-gradient(270deg,var(--a2),#E0A526)}
.sc .pol .op.win{color:#1D1D1F}
.sc .pol .op span{position:relative;z-index:1}
.sc .pol .op .p{font-variant-numeric:tabular-nums}
.sc .pol .tot{font-size:26px;color:#A1A1A6}
.sc .pol .closed{display:inline-block;background:rgba(255,255,255,.1);border-radius:12px;padding:4px 14px;font-size:24px;margin-inline-start:12px}
/* wall */
.sc .wal{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:50px}
.sc .wal h2{font-size:56px;margin:0 0 24px;font-weight:700}
.sc .wal .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-content:start}
.sc .wal .c{background:#FBF7F2;color:#1D1D1F;border-radius:22px;padding:26px 28px;display:flex;flex-direction:column;gap:12px;min-height:200px;animation:pop .6s ease both}
.sc .wal .c p{margin:0;font-size:31px;line-height:1.5;font-weight:500;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sc .wal .c b{font-size:22px;color:var(--a)}
.sc .wal .c:nth-child(3n+2){background:#F3E9FF}.sc .wal .c:nth-child(3n){background:#E8F5EE}
.sc .wal .empty{font-size:40px;color:#A1A1A6;margin-top:80px}
.sc .wal .side{display:flex;flex-direction:column;gap:20px;justify-content:center}
.sc .wal .side .cnt{text-align:center;font-size:26px;color:#D1D1D6}.sc .wal .side .cnt b{display:block;font-size:84px;color:var(--a2);line-height:1.1}
/* sponsors */
.sc .spn{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center}
.sc .spn .k{font-size:34px;color:#A1A1A6;letter-spacing:0}
.sc .spn .box{width:1100px;height:520px;border-radius:40px;background:#fff;color:#1D1D1F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;box-shadow:0 60px 120px -50px rgba(0,0,0,.8);animation:pop .7s ease both}
.sc .spn .box img{max-width:720px;max-height:280px;object-fit:contain}
.sc .spn .box .nm{font-size:110px;font-weight:700;line-height:1.2}
.sc .spn .tier{font-size:28px;font-weight:700;border-radius:999px;padding:6px 26px}
.sc .spn .t1{background:linear-gradient(135deg,#F7DD8F,#D9A441);color:#3B2A00}
.sc .spn .t2{background:linear-gradient(135deg,#ECECF0,#B9BAC2);color:#2A2A30}
.sc .spn .t3{background:linear-gradient(135deg,#F1C6A6,#C17F4E);color:#3A1E08}
.sc .spn .dots{display:flex;gap:12px}.sc .spn .dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25)}.sc .spn .dots i.on{background:var(--a2);width:40px;border-radius:8px}
/* agenda */
.sc .agd{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:60px}
.sc .agd h2{font-size:60px;margin:0 0 26px;font-weight:700}
.sc .agd .it{display:grid;grid-template-columns:200px minmax(0,1fr);gap:30px;align-items:center;padding:22px 30px;border-radius:22px;margin-bottom:12px;background:rgba(255,255,255,.05)}
.sc .agd .it .t{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;color:#D1D1D6}
.sc .agd .it b{font-size:40px;display:block;line-height:1.3}
.sc .agd .it small{font-size:26px;color:#A1A1A6}
.sc .agd .it.now{background:var(--a);box-shadow:0 30px 60px -30px var(--a)}
.sc .agd .it.now .t{color:#fff}
.sc .agd .it.now small{color:#F5E1E4}
.sc .agd .it.past{opacity:.4}
.sc .agd .tagn{display:inline-block;font-size:20px;background:#fff;color:var(--a);border-radius:999px;padding:2px 14px;margin-inline-start:12px;vertical-align:middle;font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><svg width="32" height="32" viewBox="0 0 120 120" aria-hidden="true"><rect x="14" y="30" width="92" height="60" rx="18" fill="#8E1B2C"/><rect x="39" y="55" width="10" height="24" rx="5" fill="#fff"/><rect x="55" y="45" width="10" height="34" rx="5" fill="#fff"/><rect x="71" y="51" width="10" height="28" rx="5" fill="#fff"/><path d="M36 104 h48" stroke="#8E1B2C" stroke-width="9" stroke-linecap="round"/><path d="M60 2 l3.4 8.6 8.6 3.4 -8.6 3.4 -3.4 8.6 -3.4 -8.6 -8.6 -3.4 8.6 -3.4 z" fill="#D99A26"/></svg><b>جوّ</b><small>للفعاليات</small></div>
  <div class="sync" id="sync"><i></i><span id="syncT">يتصل…</span></div>

<main class="lay">

  </aside>
</main>
<div class="full" id="full"><div class="stage" id="scr"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="../qrcode.js"></script>
<script src="ev-store.js"></script>

  function mins(s) { s = s || 0; return s < 60 ? ar(s) + ' ث' : ar(Math.round(s / 60)) + ' د'; }

    if (typeof o[last] === 'number' || last === 'tier' || last === 'autoSecs' || last === 'sponsorSecs') val = +val; o[last] = val; }
  function keepFocus(fn) { var a = document.activeElement, id = a && a.id, p = a && a.getAttribute && a.getAttribute('data-p'), pos = a && a.selectionStart; fn();
    var n = id ? $(id) : p ? document.querySelector('[data-p="' + p + '"]') : null; if (n && n !== document.body) { try { n.focus({ preventScroll: true }); if (pos != null && n.setSelectionRange) n.setSelectionRange(pos, pos); } catch (e) {} } }
  document.addEventListener('input', function (e) { var p = e.target.getAttribute && e.target.getAttribute('data-p'); if (!p) return;
    var v = e.target.type === 'checkbox' ? e.target.checked : e.target.value; if (e.target.type === 'radio' && !e.target.checked) return;
    setP(p, v); save(); renderScreen(true); if (e.target.type === 'checkbox' || e.target.type === 'radio' || e.target.tagName === 'SELECT') keepFocus(renderForm); });
  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('[data-tpl]');
    if (t) { if (cfg.type === t.getAttribute('data-tpl')) return; cfg = fromTpl(t.getAttribute('data-tpl')); save(); renderForm(); renderScreen(true); toast('انطبق قالب ' + TPL[cfg.type].label); return; }
    var m = e.target.closest && e.target.closest('[data-mod]');
    if (m) { S.moderate(m.getAttribute('data-id'), m.getAttribute('data-mod') === 'ok' ? 'ok' : 'hide').then(function () { return refreshIO(); }).catch(function () { toast('الرمز السري غير صحيح'); }); return; }
    var b = e.target.closest && e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act'), i = +b.getAttribute('data-i');
    if (a === 'addOpt') cfg.poll.opts.push('');
    if (a === 'delOpt') { if (cfg.poll.opts.length <= 2) { toast('لازم خيارين على الأقل'); return; } cfg.poll.opts.splice(i, 1); }
    if (a === 'togPoll') { cfg.poll.open = !cfg.poll.open; toast(cfg.poll.open ? 'انفتح التصويت' : 'انقفل التصويت، والنتيجة على الشاشة'); if (!cfg.poll.open && cfg.mode !== 'poll') { cfg.mode = 'poll'; } }
    if (a === 'newPoll') { cfg.poll = { id: 'p' + Date.now().toString(36), q: '', opts: ['', ''], open: true }; toast('تصويت جديد. اكتب السؤال والخيارات'); }
    if (a === 'addSp') cfg.sponsors.push({ name: 'راعي جديد', tier: 2, logo: '' });
    if (a === 'delSp') cfg.sponsors.splice(i, 1);
    if (a === 'addAg') cfg.agenda.push({ t: '', title: '', who: '' });
    if (a === 'delAg') cfg.agenda.splice(i, 1);
    if (a === 'copyRep') { var txt = 'تقرير ظهور الرعاة · ' + cfg.event.name + '\n' + cfg.sponsors.map(function (s) { var x = (io.seen || {})[s.name] || {}; return '- ' + s.name + ': ظهر ' + (x.n || 0) + ' مرة، ' + Math.round((x.s || 0) / 60) + ' دقيقة شاشة كاملة، ' + Math.round((x.r || 0) / 60) + ' دقيقة في الشريط'; }).join('\n');
      try { navigator.clipboard.writeText(txt).then(function () { toast('انتسخ التقرير'); }, function () { toast(txt); }); } catch (x) { toast(txt); } return; }
    if (a === 'resetSeen') { S.resetIO('seen').then(refreshIO); toast('تصفّر عدّاد الظهور'); return; }
    save(); renderForm(); renderScreen(true);
  });

  /* ---------- الحفظ والمزامنة ---------- */
  var saveT = null;
  function save() { clearTimeout(saveT); saveT = setTimeout(function () {
    S.saveCfg(cfg).then(function () { setSync(true); }).catch(function (e) { if (e.message === 'pin') { var p = (window.prompt && prompt('الرمز السري للفعالية') || '').trim(); if (p) { S.setPin(p); save(); } } else setSync(false, 'تعذّر الحفظ'); }); }, 400); }
  function setSync(ok, t) { $('sync').setAttribute('data-s', ok ? 'live' : ''); $('syncT').textContent = t || (S.isApi() ? 'متزامن مع الشاشات' : 'تجربة على هذا الجهاز'); }
  function refreshIO() { return S.loadIO(!isScreen).then(function (d) { if (d) io = d; if (!io.msgs) io.msgs = []; if (!isScreen) keepFocus(renderForm); renderScreen(); }); }
  S.onLocal(function (what) { if (what === 'cfg') S.loadCfg().then(function (c) { if (c) { cfg = c; if (!isScreen) keepFocus(renderForm); renderScreen(true); } }); else refreshIO(); });

  S.loadCfg().then(function (c) {
    if (c) cfg = c; else if (!isScreen) save();
    setSync(true);
    if (!isScreen) renderForm();
    fit(); renderScreen(true); refreshIO();
    setInterval(function () { var now = Date.now(); countSeen(now); renderScreen(); }, 1000);
    if (S.isApi()) { setInterval(refreshIO, 3000); setInterval(function () { S.loadCfg().then(function (c2) { if (c2 && JSON.stringify(c2) !== JSON.stringify(cfg) && (isScreen || !document.activeElement || !document.activeElement.getAttribute('data-p'))) { cfg = c2; if (!isScreen) keepFocus(renderForm); renderScreen(true); } }); }, 4000); }
  });
})();
</script>
</body>
</html>
