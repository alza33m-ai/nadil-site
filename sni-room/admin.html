<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة المطعم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--c:#8E1B2C;--bg:#F5F5F7;--card:#fff;--ink:#1D1D1F;--mut:#6E6E73;--line:#E5E5EA;--ok:#1E8556;--warn:#9A5B00;--bad:#B23A33}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top .lg{width:46px;height:46px;border-radius:50%;background:#fff;overflow:hidden;display:grid;place-items:center;box-shadow:0 1px 0 var(--line);flex:0 0 auto}
.top .lg img{width:100%;height:100%;object-fit:cover}
.top h1{margin:0;font-size:22px;line-height:1.4}
.top p{margin:0;font-size:13px;color:var(--mut)}
.top .sp{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px;background:var(--c);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.gh{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.mode{font-size:13px;border-radius:10px;padding:8px 12px;margin-bottom:16px;line-height:1.6}
.mode.local{background:#FDF6E7;color:#7A4E00}
.mode.api{background:#E1F3EA;color:#17603F}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:860px){.lay{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:10px}
.of{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 1px 0 var(--line)}
.of .th{width:58px;height:58px;border-radius:14px;flex:0 0 auto;background:var(--bg);overflow:hidden}
.of .th img{width:100%;height:100%;object-fit:cover}
.of .t{flex:1;min-width:0}
.of .t b{display:block;font-size:16px;line-height:1.45}
.of .t span{display:block;font-size:13px;color:var(--mut);line-height:1.6}
.pill{font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;white-space:nowrap}
.pill.live{background:#E1F3EA;color:#17603F}
.pill.sched{background:#FDF6E7;color:#7A4E00}
.pill.off{background:#F2F2F7;color:var(--mut)}
.of .ac{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:560px){.of{flex-wrap:wrap}.of .t{flex:1 1 calc(100% - 72px)}.of .ac{flex:1 1 100%;justify-content:flex-start;border-top:1px solid var(--line);padding-top:10px}}
.sw{position:relative;width:46px;height:28px;flex:0 0 auto}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:20px;background:#D1D1D6;transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(-18px)}
.sw input:focus-visible+span{outline:2px solid var(--c);outline-offset:2px}
.empty{background:var(--card);border-radius:18px;padding:28px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.side h2{margin:0;font-size:15px;color:var(--mut);font-weight:600}
.phone{background:#1D1D1F;border-radius:40px;padding:10px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.scr{background:var(--bg);border-radius:31px;overflow:hidden;height:560px;position:relative;display:flex;align-items:center;justify-content:center;padding:14px}
.scr .ghost{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;gap:8px;opacity:.45}
.scr .ghost i{display:block;height:58px;border-radius:14px;background:var(--card)}
.scr .ghost i:first-child{height:120px;background:var(--c);opacity:.4}
.scr .dim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.pv{position:relative;width:100%;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 20px 40px -16px rgba(0,0,0,.6)}
.pv .hd{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));color:#fff;text-align:center;padding:16px 14px 14px}
.pv .hd i{font-style:normal;display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:1px 10px;font-size:12px}
.pv .hd b{display:block;font-size:19px;line-height:1.4;margin-top:6px}
.pv .hd span{font-size:13px;opacity:.9}
.pv img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.pv .bd{padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px}
.pv .pr b{font-size:24px;color:var(--c)}.pv .pr s{color:var(--mut);margin-inline-start:8px}
.pv .wn{font-size:12px;color:var(--mut)}
.pv .bt{background:var(--c);color:#fff;border-radius:12px;padding:9px;font-weight:700;font-size:14px}
/* form sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
.ov.show{display:block}
.sheet{position:fixed;z-index:40;inset-inline:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;max-height:94vh;max-height:94dvh;display:none;flex-direction:column}
.sheet.show{display:flex}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.sh-h h3{margin:0;font-size:19px}
.x{border:0;background:#F2F2F7;width:34px;height:34px;border-radius:50%;font-size:18px}
.sh-b{overflow-y:auto;padding:4px 20px 16px;display:flex;flex-direction:column;gap:14px}
.sh-f{padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sh-f .btn{flex:1;justify-content:center;padding:13px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>label,.fl>.lb{font-size:14px;font-weight:600}
.fl small{color:var(--mut);font-size:12px}
.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff}
textarea.in{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:0;border-radius:20px;padding:6px 14px;font-size:14px;background:#F2F2F7}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
.hint{font-size:13px;color:var(--ok);font-weight:600}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1D1D1F;color:#fff;border-radius:14px;padding:12px 18px;font-size:14px;z-index:70;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
.toast.err{background:var(--bad)}
.gate{max-width:360px;margin:12vh auto;background:var(--card);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:12px;text-align:center}
.gate h1{margin:0;font-size:21px}
.gate p{margin:0;color:var(--mut);font-size:14px}
.gate .in{text-align:center;font-size:22px;letter-spacing:.3em}
.err{color:var(--bad);font-size:14px;min-height:1.6em}
.conf{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--bad)}
/* tabs + items + report */
.tabs{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:5px;box-shadow:0 1px 0 var(--line);margin-bottom:14px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;border-radius:10px;padding:8px 16px;font-weight:600;font-size:15px;color:var(--mut);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--c);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .in{max-width:260px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{flex:0 0 auto;border:0;border-radius:20px;padding:6px 14px;font-size:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.cat h3{margin:16px 2px 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.cat h3 small{color:var(--mut);font-weight:500;font-size:13px}
.ir{background:var(--card);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:52px minmax(0,1fr) 108px auto;gap:12px;align-items:center;box-shadow:0 1px 0 var(--line);margin-bottom:8px}
.ir.off{opacity:.62}
.ir .th{width:52px;height:52px;border-radius:12px;background:var(--bg);overflow:hidden}
.ir .th img{width:100%;height:100%;object-fit:cover}
.fit-contain .ir .th img{object-fit:contain}
.ir .t b{display:block;font-size:15px;line-height:1.45}
.ir .t span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir .pin{display:flex;align-items:center;gap:6px}
.ir .pin input{width:74px;padding:8px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:center}
.ir .pin small{color:var(--mut);font-size:12px}
.ir .a{display:flex;gap:8px;align-items:center}
.ir .so{font-size:12px;font-weight:700;color:var(--bad);white-space:nowrap}
@media(max-width:560px){.ir{grid-template-columns:48px minmax(0,1fr) auto}.ir .th{width:48px;height:48px}.ir .a{grid-column:1 / -1;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}}
.foot{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 0 var(--line)}
.kpi small{display:block;color:var(--mut);font-size:13px}
.kpi b{display:block;font-size:26px;line-height:1.35}
.kpi i{font-style:normal;font-size:12.5px;font-weight:700}
.kpi i.up{color:var(--ok)}.kpi i.dn{color:var(--bad)}.kpi i.eq{color:var(--mut)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.rgrid{grid-template-columns:1fr}}
.box{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 1px 0 var(--line)}
.box h3{margin:0 0 10px;font-size:15px}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11.5px;color:var(--mut)}
.bars span{width:100%;max-width:34px;background:var(--c);border-radius:6px 6px 2px 2px;min-height:3px}
.bars em{font-style:normal;font-size:12px;color:var(--ink);font-weight:600}
.rk{display:flex;flex-direction:column;gap:8px}
.rk div{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.rk div>span:first-child{color:var(--mut);font-weight:700}
.rk .bar{grid-column:2 / 4;height:5px;border-radius:3px;background:var(--bg);overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--c);opacity:.75}
.note{font-size:14px;border-bottom:1px solid var(--line);padding:8px 0}
.note:last-child{border:0}
.note small{color:var(--mut)}
.wa{background:#1E8556}
</style>
</head>
<body>
<div id="root"></div>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sh-h"><h3 id="shT">عرض جديد</h3><button type="button" class="x" id="shX" aria-label="إغلاق">×</button></div>
  <div class="sh-b" id="form"></div>
  <div class="sh-f"><button type="button" class="btn" id="fSave">حفظ ونشر العرض</button><button type="button" class="btn gh" id="fCancel">إلغاء</button></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script src="offers.js"></script>
<script>
(function(){
const D = window.NADIL_DATA, R = D.restaurant, S = window.NadilOffers.store, live = window.NadilOffers.isLive, M = window.NadilOffers.menu;
const $ = s => document.querySelector(s);
const na = n => new Intl.NumberFormat("ar-SA-u-nu-arab").format(n);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => na(n) + " " + (R.currency || "ر.س");
const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const BADGES = ["عرض","لفترة محدودة","جديد","هابي آور","عرض اليوم"];
document.documentElement.style.setProperty("--c", R.color || "#8E1B2C");
if (R.theme && R.theme.bg) document.documentElement.style.setProperty("--bg", R.theme.bg);
document.title = "لوحة المطعم · " + R.name;
if ((R.theme || {}).fit === "contain") document.documentElement.classList.add("fit-contain");
const itemById = id => D.items.find(i => i.id === id);
let offers = [], pin = "", edit = null, confirmDel = null, tab = "offers";
try { tab = sessionStorage.getItem("nadil_admin_tab") || "offers"; } catch(e) {}

/* ---------- الدخول ---------- */
function gate(msg){
  $("#root").innerHTML = `<div class="gate"><h1>لوحة ${esc(R.name)}</h1><p>أدخل الرمز السري لصاحب المطعم</p>
    <input class="in" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="الرمز السري">
    <div class="err" id="perr">${esc(msg || "")}</div><button type="button" class="btn" id="pgo" style="justify-content:center">دخول</button>
    ${S.mode === "local" ? `<p style="font-size:12px">نسخة تجريبية: الرمز <b dir="ltr">${esc(D.adminPin || "1234")}</b></p>` : ""}</div>`;
  const go = async () => { const v = $("#pin").value.trim();
    if (S.mode === "local" && v !== String(D.adminPin || "1234")) { $("#perr").textContent = "الرمز غير صحيح"; return; }
    if (S.mode === "api") { $("#perr").textContent = "يتحقق…";
      try { await window.NadilOffers.report(1, v); } catch(e) { $("#perr").textContent = /الرمز/.test(e.message) ? "الرمز غير صحيح" : e.message; return; } }
    pin = v; start(); };
  $("#pgo").onclick = go; $("#pin").addEventListener("keydown", e => { if (e.key === "Enter") go(); }); $("#pin").focus();
}
async function start(){
  try { offers = await S.load(); } catch(e) { offers = []; toast(e.message, true); }
  try { M.apply(await M.load()); } catch(e) { toast(e.message, true); }
  draw();
}
const TABS = [["offers","العروض"],["items","الأصناف"],["report","التقرير"]];
function tabsHTML(){ return `<div class="tabs" role="tablist">${TABS.map(([k,t]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${t}</button>`).join("")}</div>`; }
function topHTML(title, sub, btns){ return `<div class="top"><span class="lg">${R.logo ? `<img src="${esc(R.logo)}" alt="">` : ""}</span><div><h1>${title}</h1><p>${sub}</p></div><div class="sp">${btns || ""}</div></div>`; }
function draw(){ if (tab === "items") return drawItems(); if (tab === "report") return drawReport(); drawOffers(); }

/* ---------- القائمة ---------- */
function status(o){ if (!o.active) return ["off","موقوف"]; if (live(o)) return ["live","يظهر الحين"]; return ["sched","مجدول"]; }
function whenTxt(o){ const p = [];
  if (o.days && o.days.length && o.days.length < 7) p.push(o.days.map(d => DAYS[d]).join("، "));
  if (o.from && o.to) p.push("من " + o.from + " إلى " + o.to);
  if (o.start) p.push("يبدأ " + o.start); if (o.end) p.push("ينتهي " + o.end);
  return p.join(" · ") || "كل يوم، طول الوقت"; }
function drawOffers(){
  const liveN = offers.filter(live).length;
  $("#root").innerHTML = `<div class="wrap">
    ${topHTML("العروض", esc(R.name) + " · " + na(liveN) + " عرض يظهر للزبائن الحين", `<a class="btn gh" href="index.html?preview" target="_blank" rel="noopener">افتح المنيو</a><button type="button" class="btn" id="add">+ عرض جديد</button>`)}
    ${tabsHTML()}
    <div class="mode ${S.mode}">${S.mode === "local" ? "<b>نسخة تجريبية:</b> العروض تنحفظ على هذا الجهاز بس، وتظهر في المنيو لما تفتحه من نفس الجهاز. لما نربط الخادم تظهر لكل الزبائن." : "<b>متصل:</b> أي عرض تحفظه يظهر لكل الزبائن على طول."}</div>
    <div class="lay"><div class="list" id="list">${offers.length ? offers.map((o,i) => { const it = itemById(o.itemId), [k,t] = status(o);
      return `<article class="of"><span class="th">${it && (it.thumb||it.img) ? `<img src="${esc(it.thumb||it.img)}" alt="">` : ""}</span>
        <div class="t"><b>${esc(o.title)}</b><span>${it ? esc(it.name) + (o.newPrice != null ? " · " + money(o.newPrice) + " بدل " + money(it.price) : "") : "إعلان عام"}</span><span>${esc(whenTxt(o))}${o.popup === false ? " · بدون نافذة منبثقة" : ""}</span></div>
        <div class="ac"><span class="pill ${k}">${t}</span>
          <label class="sw" title="تشغيل وإيقاف"><input type="checkbox" data-tg="${i}" ${o.active ? "checked" : ""} aria-label="تشغيل ${esc(o.title)}"><span></span></label>
          <button type="button" class="btn gh sm" data-ed="${i}">تعديل</button>
          ${confirmDel === i ? `<span class="conf">متأكد؟ <button type="button" class="btn sm" data-del="${i}" style="background:var(--bad)">احذف</button><button type="button" class="btn gh sm" data-nodel>لا</button></span>` : `<button type="button" class="btn gh sm" data-askdel="${i}">حذف</button>`}
        </div></article>`; }).join("") : `<div class="empty"><b>ما فيه عروض للحين</b>اضغط «عرض جديد» وأضف أول عرض، ويطلع للزبون أول ما يفتح المنيو.</div>`}</div>
      <aside class="side"><h2>كذا يشوفه الزبون</h2><div class="phone"><div class="scr" id="pvScr"></div></div></aside></div></div>`;
  preview(offers.find(live) || offers[0] || null);
}
$("#root").addEventListener("click", async e => {
  const tb = e.target.closest("[data-tab]"); if (tb) { tab = tb.dataset.tab; try { sessionStorage.setItem("nadil_admin_tab", tab); } catch(x) {} confirmDel = null; return draw(); }
  if (tab === "items") return itemsClick(e);
  if (tab === "report") return reportClick(e);
  if (e.target.closest("#add")) return openForm(null);
  const ed = e.target.closest("[data-ed]"); if (ed) return openForm(+ed.dataset.ed);
  const ad = e.target.closest("[data-askdel]"); if (ad) { confirmDel = +ad.dataset.askdel; return draw(); }
  if (e.target.closest("[data-nodel]")) { confirmDel = null; return draw(); }
  const dl = e.target.closest("[data-del]"); if (dl) { const keep = offers.slice(); offers.splice(+dl.dataset.del, 1); confirmDel = null;
    if (await persist("انحذف العرض")) draw(); else { offers = keep; draw(); } }
});
$("#root").addEventListener("change", async e => { if (tab === "items") return itemsChange(e); const tg = e.target.closest("[data-tg]"); if (!tg) return;
  const o = offers[+tg.dataset.tg]; o.active = tg.checked; if (!(await persist(o.active ? "اشتغل العرض" : "توقف العرض"))) o.active = !o.active; draw(); });

/* ---------- المعاينة ---------- */
function preview(o){
  const sc = $("#pvScr"); if (!sc) return;
  if (!o) { sc.innerHTML = `<div class="ghost"><i></i><i></i><i></i><i></i></div><p style="position:relative;color:var(--mut);font-size:14px;text-align:center">لما تضيف عرض يطلع هنا</p>`; return; }
  const it = itemById(o.itemId);

let rep = null, repDays = 7, repErr = "";
const DAYN = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function sampleReport(n){ const days = [], seed = [62,48,55,71,96,120,88]; let o = 0, r = 0;
  for (let j = n - 1; j >= 0; j--) { const d = new Date(Date.now() - j * 864e5).toISOString().slice(0,10), x = seed[(n - 1 - j) % 7]; days.push({d, o:x, r:Math.round(x * .38)}); o += x; r += Math.round(x * .38); }
  const h = Array(24).fill(0); [[13,30],[14,42],[15,25],[19,48],[20,81],[21,95],[22,70],[23,31]].forEach(([k,v]) => h[k] = v);
  const ids = D.items.slice(0, 8).map((it,i) => [it.id, 60 - i * 6]);
  return {sample: true, range: n, days, sum:{o, r, v: r * 74, s:[r * .6 * 4.6, r * .6], h}, prev:{o: Math.round(o * .86), r: Math.round(r * .9), v: Math.round(r * .9 * 70), s:[0,0]},
    items: ids, tables: [["4",58],["7",51],["2",44],["9",39],["1",31]], pairs: D.items.slice(8,11).map((it,i) => [it.id, 14 - i * 3]), offers: [],
    notes: [{d: days[6].d, s:5, t:"4", n:"المنيو مرتب وسريع، والصور حلوة"}, {d: days[5].d, s:4, t:"7", n:"ياليت تضيفون حليب شوفان"}]}; }
async function loadReport(){ repErr = "";
  if (S.mode === "local") { rep = sampleReport(repDays); return; }
  try { rep = await window.NadilOffers.report(repDays, pin); } catch(e) { repErr = e.message; rep = null; if (/الرمز/.test(e.message)) gate(e.message); } }
const pct = (a, b) => b ? Math.round((a - b) / b * 100) : (a ? 100 : 0);
const chg = (a, b) => { const p = pct(a, b); return `<i class="${p > 0 ? "up" : p < 0 ? "dn" : "eq"}">${p > 0 ? "▲ " : p < 0 ? "▼ " : ""}${na(Math.abs(p))}٪ عن الفترة اللي قبل</i>`; };
const iname = id => (D.items.find(i => i.id === id) || {}).name || "صنف محذوف";
function reportText(){ const s = rep.sum, avg = s.r ? Math.round(s.v / s.r) : 0, st = s.s[1] ? (s.s[0] / s.s[1]).toFixed(1) : "—";
  const peak = s.h.indexOf(Math.max(...s.h));
  return `تقرير نادل · ${R.name}\nآخر ${repDays} أيام\n\n` +
    `• فتح المنيو: ${s.o} مرة\n• طلبات جاهزة: ${s.r}\n• متوسط الطلب: ${avg} ريال\n• التقييم: ${st} من 5 (${s.s[1]} تقييم)\n• وقت الذروة: ${peak}:00\n\n` +
    `الأكثر مشاهدة:\n` + rep.items.slice(0,5).map((x,i) => `${i+1}. ${iname(x[0])} (${x[1]})`).join("\n") +
    (rep.notes.length ? `\n\nآخر ملاحظات الزبائن:\n` + rep.notes.slice(0,3).map(n => `- ${n.n}`).join("\n") : "") + `\n\nمن نادل`; }
async function drawReport(){
  if (!rep || rep.range !== repDays) { $("#root").innerHTML = `<div class="wrap">${topHTML("التقرير", esc(R.name))}${tabsHTML()}<div class="empty">يجهّز التقرير…</div></div>`; await loadReport(); if (tab !== "report") return; }
  if (!rep) { $("#root").innerHTML = `<div class="wrap">${topHTML("التقرير", esc(R.name))}${tabsHTML()}<div class="empty"><b>ما قدرنا نجيب التقرير</b>${esc(repErr)}</div></div>`; return; }
  const s = rep.sum, p = rep.prev, avg = s.r ? s.v / s.r : 0, pavg = p.r ? p.v / p.r : 0, st = s.s[1] ? s.s[0] / s.s[1] : 0;
  const mx = Math.max(1, ...rep.days.map(d => d.o)), hmx = Math.max(1, ...s.h), peak = s.h.indexOf(Math.max(...s.h));
  const imx = Math.max(1, ...rep.items.map(x => x[1]));
  let phone = ""; try { phone = localStorage.getItem("nadil_wa_" + window.NadilOffers.slug) || ""; } catch(e) {}
  $("#root").innerHTML = `<div class="wrap">
    ${topHTML("التقرير", esc(R.name) + " · آخر " + na(repDays) + " أيام", `<div class="seg" id="rRange">${[7,30].map(n => `<button type="button" data-rd="${n}" aria-pressed="${repDays === n}">${n === 7 ? "أسبوع" : "شهر"}</button>`).join("")}</div>`)}
    ${tabsHTML()}
    ${rep.sample ? `<div class="mode local"><b>بيانات تجريبية للعرض:</b> التقرير الحقيقي يشتغل لما نربط الخادم، ويتجمع من زيارات الزبائن تلقائياً.</div>` : ""}
    <div class="kpis">
      <div class="kpi"><small>فتح المنيو</small><b>${na(s.o)}</b>${chg(s.o, p.o)}</div>
      <div class="kpi"><small>طلبات جاهزة</small><b>${na(s.r)}</b>${chg(s.r, p.r)}</div>
      <div class="kpi"><small>متوسط الطلب</small><b>${money(Math.round(avg))}</b>${chg(avg, pavg)}</div>
      <div class="kpi"><small>تقييم الزبائن</small><b>${st ? na(+st.toFixed(1)) + " ★" : "—"}</b><i class="eq">${na(s.s[1])} تقييم</i></div>
    </div>
    <div class="rgrid">
      <div class="box"><h3>فتح المنيو باليوم</h3><div class="bars">${rep.days.slice(-7).map(d => `<div><em>${na(d.o)}</em><span style="height:${Math.round(d.o / mx * 100)}%"></span>${DAYN[new Date(d.d + "T12:00:00").getDay()].replace("ال","")}</div>`).join("")}</div></div>
      <div class="box"><h3>أوقات الزحمة ${s.h.some(Boolean) ? `<small style="color:var(--mut);font-weight:500">· الذروة ${na(peak)}:٠٠</small>` : ""}</h3><div class="bars" style="gap:2px">${s.h.map((x,i) => `<div title="${i}:00"><span style="height:${Math.round(x / hmx * 100)}%;max-width:14px;opacity:${i === peak ? 1 : .55}"></span>${i % 6 === 0 ? na(i) : "&nbsp;"}</div>`).join("")}</div></div>
      <div class="box"><h3>الأكثر مشاهدة</h3><div class="rk">${rep.items.length ? rep.items.slice(0,6).map((x,i) => `<div><span>${na(i+1)}</span><span>${esc(iname(x[0]))}</span><span>${na(x[1])}</span><span class="bar"><i style="width:${Math.round(x[1] / imx * 100)}%"></i></span></div>`).join("") : `<p class="note">لسا ما فيه بيانات</p>`}</div></div>
      <div class="box"><h3>أكثر الطاولات استخداماً</h3><div class="rk">${rep.tables.length ? rep.tables.map((x,i) => `<div><span>${na(i+1)}</span><span>طاولة ${na(+x[0])}</span><span>${na(x[1])}</span></div>`).join("") : `<p class="note">لسا ما فيه بيانات</p>`}</div>
        ${rep.pairs.length ? `<h3 style="margin-top:14px">انضاف من «يمشي معها»</h3><div class="rk">${rep.pairs.map((x,i) => `<div><span>${na(i+1)}</span><span>${esc(iname(x[0]))}</span><span>${na(x[1])}</span></div>`).join("")}</div>` : ""}</div>
      <div class="box" style="grid-column:1 / -1"><h3>ملاحظات الزبائن</h3>${rep.notes.length ? rep.notes.map(n => `<div class="note">${"★".repeat(n.s)} ${esc(n.n)} <small>· ${n.t ? "طاولة " + na(+n.t) + " · " : ""}${esc(n.d)}</small></div>`).join("") : `<p class="note">ما فيه ملاحظات في هذي الفترة</p>`}</div>
    </div>
    <div class="box" style="margin-top:12px"><h3>أرسل التقرير على الواتساب</h3>
      <div class="tools" style="margin:0"><input class="in" id="waN" dir="ltr" inputmode="tel" placeholder="9665XXXXXXXX" value="${esc(phone)}" aria-label="رقم الواتساب"><a class="btn wa" id="waGo" href="#" target="_blank" rel="noopener">أرسل على الواتساب</a></div>
      <p class="note" style="border:0;padding-bottom:0"><small>يفتح الواتساب والتقرير مكتوب جاهز. اكتب رقمك أو رقم المدير، أو اتركه فاضي وتختار المحادثة بنفسك.</small></p></div>
  </div>`;
}
function reportClick(e){
  const rd = e.target.closest("[data-rd]"); if (rd) { repDays = +rd.dataset.rd; return drawReport(); }
  const wa = e.target.closest("#waGo"); if (wa) { const n = ($("#waN").value || "").replace(/\D/g, "");
    try { localStorage.setItem("nadil_wa_" + window.NadilOffers.slug, n); } catch(x) {}
    wa.href = "https://wa.me/" + n + "?text=" + encodeURIComponent(reportText()); }
}

S.ready.then(() => gate());
})();
</script>
</body>
</html>
